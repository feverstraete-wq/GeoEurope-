<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mission Europe – pays et capitales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#2B3A8C; --bg2:#22306F; --ink:#1D2350; --paper:#FFFFFF; --sea:#A8DCEA; --land:#FBF3DC; --land-edge:#8A7F68;
  --other:#D9D2BF; --text-on-bg:#FFFFFF; --muted:#5A5F86; --good:#2FA65A; --bad:#E0453A; --hint:#FF9F1C; --dot:#1D2350;
  --shadow:0 4px 0 rgba(0,0,0,.25);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141A3D; --bg2:#0E1330; --ink:#EEF0FF; --paper:#232A57; --sea:#27496A; --land:#3B4270; --land-edge:#8C93C4;
    --other:#2C3159; --text-on-bg:#FFFFFF; --muted:#B5BAE0; --dot:#FFE27A;
  }
}
:root[data-theme="dark"]{
  --bg:#141A3D; --bg2:#0E1330; --ink:#EEF0FF; --paper:#232A57; --sea:#27496A; --land:#3B4270; --land-edge:#8C93C4;
  --other:#2C3159; --text-on-bg:#FFFFFF; --muted:#B5BAE0; --dot:#FFE27A;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Baloo 2",ui-rounded,"Segoe UI Rounded","Trebuchet MS",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;cursor:pointer;border:0}
button:focus-visible{outline:3px solid #FFD23F;outline-offset:3px}
.screen{position:fixed;inset:0;display:none}
.screen.on{display:flex}

/* ---------- accueil ---------- */
#menu{flex-direction:column;align-items:center;overflow:auto;padding:24px 16px 32px;
  background:radial-gradient(circle at 20% 10%, #3D4FB0 0, transparent 45%), var(--bg)}
.logo{color:var(--text-on-bg);text-align:center;margin:8px 0 18px}
.logo h1{font-size:clamp(40px,9vw,68px);line-height:.95;margin:0;font-weight:800;letter-spacing:-.5px;
  text-shadow:0 5px 0 #FF8A5B}
.logo p{margin:10px 0 0;font-size:19px;opacity:.9}
.panel{background:var(--paper);border-radius:22px;padding:18px 18px 20px;width:min(560px,100%);box-shadow:var(--shadow);margin-bottom:16px}
.panel h2{margin:0 0 10px;font-size:22px}
.choices{display:grid;gap:10px}
.choices.three{grid-template-columns:repeat(3,1fr)}
.choice{background:transparent;border:3px solid #D5D8EE;border-radius:16px;padding:10px 8px;color:var(--ink);text-align:center;line-height:1.15}
.choice b{display:block;font-size:20px}
.choice span{font-size:14px;color:var(--muted)}
.choice .ico{font-size:28px;display:block}
.choice[aria-pressed="true"]{border-color:#FF8A5B;background:rgba(255,138,91,.14)}
.go{background:#FFD23F;color:#1D2350;font-size:28px;font-weight:800;padding:12px 44px;border-radius:999px;box-shadow:0 6px 0 #C99A00;margin-top:4px}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 #C99A00}
.best{color:var(--text-on-bg);opacity:.85;margin-top:12px;font-size:16px;min-height:22px;text-align:center}

/* ---------- jeu ---------- */
#game{flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg2);color:var(--text-on-bg)}
.iconbtn{background:rgba(255,255,255,.14);color:#fff;border-radius:12px;height:42px;min-width:42px;padding:0 10px;font-size:18px;font-weight:700}
.ask{flex:1;background:var(--paper);color:var(--ink);border-radius:16px;padding:6px 14px;box-shadow:var(--shadow);min-width:0}
.ask small{display:block;font-size:14px;color:var(--muted);line-height:1.2}
.ask strong{display:block;font-size:clamp(22px,5vw,30px);line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{text-align:right;font-size:15px;line-height:1.2;white-space:nowrap}
.stats b{font-size:22px;display:block}
.bar{height:6px;background:rgba(255,255,255,.15)}
.bar i{display:block;height:100%;width:0;background:#FFD23F;transition:width .3s}
.mapwrap{flex:1;position:relative;background:var(--sea);overflow:hidden;touch-action:none}
svg#map{width:100%;height:100%;display:block;cursor:grab}
svg#map.panning{cursor:grabbing}
.bgc{fill:var(--other);stroke:var(--land-edge);stroke-width:.5;vector-effect:non-scaling-stroke;pointer-events:none}
.cty{fill:var(--land);stroke:var(--land-edge);stroke-width:.8;vector-effect:non-scaling-stroke;transition:fill .25s}
.cty.found{stroke:#fff}
.cty.flash{fill:var(--bad)!important}
.cty.reveal{fill:var(--hint)!important}
.cty.pulse, .micro.pulse{animation:pulse .8s ease-in-out infinite}
@keyframes pulse{50%{fill:var(--hint);opacity:.75}}
.micro{fill:var(--land);stroke:var(--land-edge);stroke-width:1;vector-effect:non-scaling-stroke;fill-opacity:.9}
.hit{fill:transparent}
.capdot{fill:var(--paper);stroke:var(--dot);stroke-width:2;vector-effect:non-scaling-stroke}
.capdot.ok{fill:var(--good);stroke:#fff}
.capdot.flash{fill:var(--bad)}
.capdot.pulse{animation:pdot .7s ease-in-out infinite}
@keyframes pdot{50%{fill:var(--hint)}}
.star{fill:#FFD23F;stroke:#1D2350;stroke-width:1.2;vector-effect:non-scaling-stroke}
.lbl{font-weight:700;fill:#1D2350;paint-order:stroke;stroke:rgba(255,255,255,.85);stroke-linejoin:round;pointer-events:none;text-anchor:middle;dominant-baseline:middle}
.clabel{font-weight:600;fill:#1D2350;paint-order:stroke;stroke:#fff;stroke-linejoin:round;pointer-events:none}
.miss{stroke:var(--bad);stroke-width:2;vector-effect:non-scaling-stroke;stroke-dasharray:4 3;fill:none;pointer-events:none}
.pin{fill:var(--bad);stroke:#fff;stroke-width:1.5;vector-effect:non-scaling-stroke;pointer-events:none}
@media (prefers-reduced-motion: reduce){ .cty.pulse,.micro.pulse,.capdot.pulse{animation:none;fill:var(--hint)} }
.zoom{position:absolute;right:10px;bottom:14px;display:flex;flex-direction:column;gap:8px}
.zoom button{width:46px;height:46px;border-radius:14px;background:var(--paper);color:var(--ink);font-size:26px;font-weight:800;box-shadow:var(--shadow)}
.toast{position:absolute;left:50%;top:14px;transform:translate(-50%,-10px);background:var(--paper);color:var(--ink);
  padding:8px 16px;border-radius:14px;font-size:19px;font-weight:600;box-shadow:var(--shadow);opacity:0;transition:.2s;pointer-events:none;
  max-width:calc(100% - 24px);text-align:center;border-left:8px solid var(--muted)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.good{border-left-color:var(--good)} .toast.bad{border-left-color:var(--bad)} .toast.hint{border-left-color:var(--hint)}
.tip{position:absolute;left:12px;bottom:14px;color:#1D2350;background:rgba(255,255,255,.75);border-radius:10px;padding:4px 10px;font-size:14px;max-width:60%}

/* ---------- fin ---------- */
#end{align-items:center;justify-content:center;background:rgba(20,26,61,.7);padding:16px}
.card{background:var(--paper);border-radius:26px;padding:26px 22px;width:min(420px,100%);text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.3)}
.stars{font-size:58px;letter-spacing:6px;line-height:1}
.stars .off{filter:grayscale(1);opacity:.3}
.card h2{font-size:32px;margin:10px 0 0;line-height:1.1}
.card p{font-size:19px;margin:8px 0;color:var(--muted)}
.card .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.ghost{background:transparent;border:3px solid #D5D8EE;color:var(--ink);border-radius:999px;padding:8px 22px;font-size:20px;font-weight:700}
.card .go{font-size:22px;padding:10px 26px}
@media (max-width:520px){
  .choices.three{grid-template-columns:1fr}
  .choice{display:flex;align-items:center;gap:12px;text-align:left;padding:8px 14px}
  .choice .ico{font-size:26px}
  .stats span{display:none}
  .tip{display:none}
}
</style>
</head>
<body>

<section id="menu" class="screen on">
  <div class="logo">
    <h1>Mission Europe</h1>
    <p>Retrouve les pays et les capitales sur la carte</p>
  </div>

  <div class="panel">
    <h2>Ton niveau</h2>
    <div class="choices three" id="levels">
      <button class="choice" data-level="debutant" aria-pressed="true"><span class="ico">🌱</span><div><b>Débutant</b><span>16 grands pays</span></div></button>
      <button class="choice" data-level="moyen" aria-pressed="false"><span class="ico">🚲</span><div><b>Moyen</b><span>30 pays</span></div></button>
      <button class="choice" data-level="avance" aria-pressed="false"><span class="ico">🚀</span><div><b>Avancé</b><span>Tous les 47 pays</span></div></button>
    </div>
  </div>

  <div class="panel">
    <h2>Que veux-tu placer ?</h2>
    <div class="choices three" id="modes">
      <button class="choice" data-mode="pays" aria-pressed="true"><span class="ico">🗺️</span><div><b>Les pays</b><span>Touche le bon pays</span></div></button>
      <button class="choice" data-mode="capitales" aria-pressed="false"><span class="ico">📍</span><div><b>Les capitales</b><span>Place la ville</span></div></button>
      <button class="choice" data-mode="mix" aria-pressed="false"><span class="ico">🎲</span><div><b>Les deux</b><span>Mélangés</span></div></button>
    </div>
  </div>

  <button class="go" id="start">Jouer !</button>
  <div class="best" id="best"></div>
</section>

<section id="game" class="screen">
  <div class="top">
    <button class="iconbtn" id="back" aria-label="Retour au menu">✕</button>
    <div class="ask"><small id="askType">Trouve le pays</small><strong id="askName">…</strong></div>
    <div class="stats"><b id="score">0</b><span>points · </span><span id="count">1/16</span></div>
    <button class="iconbtn" id="skip" aria-label="Passer la question">Passer</button>
  </div>
  <div class="bar"><i id="progress"></i></div>
  <div class="mapwrap" id="wrap">
    <svg id="map" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Carte de l'Europe">
      <g id="gBg"></g><g id="gCty"></g><g id="gMicro"></g><g id="gLbl"></g><g id="gCap"></g><g id="gFx"></g>
    </svg>
    <div class="toast" id="toast"></div>
    <div class="tip" id="tip">Glisse pour déplacer la carte, + et − pour zoomer</div>
    <div class="zoom">
      <button id="zin" aria-label="Zoomer">+</button>
      <button id="zout" aria-label="Dézoomer">−</button>
      <button id="zreset" aria-label="Voir toute la carte" style="font-size:20px">⤢</button>
    </div>
  </div>
</section>

<section id="end" class="screen">
  <div class="card">
    <div class="stars" id="stars"></div>
    <h2 id="endTitle">Bravo !</h2>
    <p id="endScore"></p>
    <p id="endBest"></p>
    <div class="row">
      <button class="ghost" id="toMenu">Menu</button>
      <button class="go" id="again">Rejouer</button>
    </div>
  </div>
</section>

function el(tag, attrs, parent){ const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
el("path", {d: DATA.bg, class: "bgc"}, gBg);

});

/* ---------- zoom et déplacement ---------- */
let vb = {x:0, y:0, w:W, h:H};
function applyVB(){
  vb.w = Math.max(W/10, Math.min(W, vb.w)); vb.h = vb.w * H / W;
  vb.x = Math.max(-W*0.4, Math.min(W*1.4 - vb.w, vb.x));
  vb.y = Math.max(-H*0.3, Math.min(H*1.3 - vb.h, vb.y));
  svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  const z = W / vb.w, s = 1 / Math.sqrt(z);
  document.querySelectorAll(".micro").forEach(m => m.setAttribute("r", 4.5 * s));
  document.querySelectorAll(".hit").forEach(m => m.setAttribute("r", 10 * s));
  document.querySelectorAll(".capdot").forEach(m => m.setAttribute("r", 5 * s));
  document.querySelectorAll(".caphit").forEach(m => m.setAttribute("r", 12 * s));
  document.querySelectorAll(".pin").forEach(m => m.setAttribute("r", 4 * s));
  document.querySelectorAll(".lbl").forEach(t => {
    const small = +t.dataset.a < 500;
    t.setAttribute("font-size", 13 * Math.pow(z, -0.75));
    t.setAttribute("stroke-width", 3 * Math.pow(z, -0.75));
    t.style.display = (small && z < 2.2) ? "none" : "";
  });
  document.querySelectorAll(".clabel").forEach(t => {
    t.setAttribute("font-size", 11 * Math.pow(z, -0.8));
    t.setAttribute("stroke-width", 3 * Math.pow(z, -0.8));
    t.setAttribute("x", +t.dataset.x + 7 * s);
    t.style.display = z < 1.6 ? "none" : "";
  });
}
function toMap(cx, cy){ const p = svg.createSVGPoint(); p.x = cx; p.y = cy; return p.matrixTransform(svg.getScreenCTM().inverse()); }
function zoomAt(factor, cx, cy){
  const before = toMap(cx, cy);
  const nw = Math.max(W/10, Math.min(W, vb.w / factor));
  const k = nw / vb.w;
  vb.x = before.x - (before.x - vb.x) * k; vb.y = before.y - (before.y - vb.y) * k; vb.w = nw;
  applyVB();
}
function zoomCenter(f){ const r = svg.getBoundingClientRect(); zoomAt(f, r.left + r.width/2, r.top + r.height/2); }
document.getElementById("zin").onclick = () => zoomCenter(1.6);
document.getElementById("zout").onclick = () => zoomCenter(1/1.6);
document.getElementById("zreset").onclick = () => { vb = {x:0,y:0,w:W,h:H}; applyVB(); };
svg.addEventListener("wheel", e => { e.preventDefault(); zoomAt(e.deltaY < 0 ? 1.2 : 1/1.2, e.clientX, e.clientY); }, {passive:false});

const pointers = new Map(); let downPt = null, moved = false, pinch = null;
svg.addEventListener("pointerdown", e => {
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (pointers.size === 1){ downPt = {x:e.clientX, y:e.clientY, vx:vb.x, vy:vb.y}; moved = false; }
  if (pointers.size === 2){
    const [a,b] = [...pointers.values()];
    pinch = {d: Math.hypot(a.x-b.x, a.y-b.y), w: vb.w}; moved = true;
  }
});
svg.addEventListener("pointermove", e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (pointers.size === 2 && pinch){
    const [a,b] = [...pointers.values()];
    const d = Math.hypot(a.x-b.x, a.y-b.y);
    const target = pinch.w * pinch.d / d;
    zoomAt(vb.w / target, (a.x+b.x)/2, (a.y+b.y)/2);
    return;
  }
  if (pointers.size === 1 && downPt){
    const dx = e.clientX - downPt.x, dy = e.clientY - downPt.y;
    if (!moved && Math.hypot(dx, dy) > 7){ moved = true; svg.setPointerCapture(e.pointerId); svg.classList.add("panning"); }
    if (moved){
      const r = svg.getBoundingClientRect();
      const scale = Math.max(vb.w / r.width, vb.h / r.height);
      vb.x = downPt.vx - dx * scale; vb.y = downPt.vy - dy * scale; applyVB();
    }
  }
});
function endPointer(e){
  const wasTap = pointers.size === 1 && !moved && downPt;
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (pointers.size === 0){ svg.classList.remove("panning"); }
  if (wasTap && e.type === "pointerup") handleTap(e.clientX, e.clientY);
  if (pointers.size === 0) downPt = null;
}
svg.addEventListener("pointerup", endPointer);
svg.addEventListener("pointercancel", endPointer);

/* ---------- déroulement du jeu ---------- */
let questions = [], qi = 0, tries = 0, score = 0, busy = false, found = {}, colorIdx = 0, capIds = [];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function startGame(){
  const ids = LEVELS[level];
  questions = shuffle(ids.map(id => {
    let type = mode === "capitales" ? "cap" : mode === "pays" ? "pays" : (Math.random() < .5 ? "pays" : "cap");
    if (type === "cap" && NO_CAPITAL_Q.includes(id)) type = mode === "capitales" ? null : "pays";
    return type ? {id, type} : null;
  }).filter(Boolean));
  qi = 0; score = 0; found = {}; colorIdx = 0;
  // remise à zéro de la carte
  Object.values(shapes).forEach(p => { p.classList.remove("found","reveal","pulse","flash"); p.style.fill = ""; });
  Object.values(micros).forEach(p => { p.classList.remove("pulse"); p.style.fill = ""; });
  gLbl.innerHTML = ""; gCap.innerHTML = ""; gFx.innerHTML = "";
  // points des capitales (débutant et moyen)
  capIds = [];
  const hasCap = questions.some(q => q.type === "cap");
  if (hasCap && level !== "avance"){
    ids.filter(id => !NO_CAPITAL_Q.includes(id)).forEach(id => {
      const c = byId[id];
      el("circle", {cx:c.cx, cy:c.cy, r:5, class:"capdot", "data-cap":id}, gCap);
      el("circle", {cx:c.cx, cy:c.cy, r:12, class:"hit caphit", "data-cap":id}, gCap);
      capIds.push(id);
    });
  }
  document.getElementById("tip").textContent = hasCap && level === "avance"
    ? "Touche l'endroit exact de la ville (à moins de " + TOLERANCE_KM + " km)"
    : "Glisse pour déplacer la carte, + et − pour zoomer";
  vb = {x:0,y:0,w:W,h:H}; applyVB();
  show("game");
  nextQuestion();
}

function nextQuestion(){
  gFx.innerHTML = "";
  Object.values(shapes).forEach(p => p.classList.remove("pulse","reveal"));
  Object.values(micros).forEach(p => p.classList.remove("pulse"));
  gCap.querySelectorAll(".capdot").forEach(d => d.classList.remove("pulse"));
  if (qi >= questions.length) return finish();
  const q = questions[qi]; tries = 0; busy = false;
  const c = byId[q.id];
  if (q.type === "pays"){
    document.getElementById("askType").textContent = "Trouve le pays";
    document.getElementById("askName").textContent = c.fr;
  } else {
    document.getElementById("askType").textContent = "Place la capitale " + de(q.id);
    document.getElementById("askName").textContent = c.cap;
  }
  document.getElementById("score").textContent = score;
  document.getElementById("count").textContent = (qi + 1) + "/" + questions.length;
  document.getElementById("progress").style.width = (qi / questions.length * 100) + "%";
}

let toastTimer;
function toast(msg, kind){
  const t = document.getElementById("toast");
  t.textContent = msg; t.className = "toast on " + (kind || "");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("on"), 2200);
}
const BRAVO = ["Bravo !","Super !","Génial !","Exactement !","Bien joué !","Parfait !"];

function colorCountry(id){
  if (found[id]) return;
  found[id] = COLORS[colorIdx++ % COLORS.length];
  if (shapes[id]){ shapes[id].style.fill = found[id]; shapes[id].classList.add("found"); }
  if (micros[id]) micros[id].style.fill = found[id];
  const c = byId[id];
  const t = el("text", {x:c.lx, y:c.ly, class:"lbl", "data-a":c.a}, gLbl);
  t.textContent = c.fr;
  applyVB();
}
function markCapital(id){
  const c = byId[id];
  let dot = gCap.querySelector(`.capdot[data-cap="${id}"]`);
  if (!dot) dot = el("circle", {cx:c.cx, cy:c.cy, r:5, class:"capdot"}, gCap);
  dot.classList.add("ok");
  if (!gCap.querySelector(`.clabel[data-cap="${id}"]`)){
    const t = el("text", {x:c.cx, y:c.cy, "data-x":c.cx, "dominant-baseline":"middle", class:"clabel", "data-cap":id}, gCap);
    t.textContent = c.cap;
  }
  applyVB();
}

function success(){
  const q = questions[qi];
  const pts = Math.max(1, 3 - tries);
  score += pts; busy = true;
  if (q.type === "pays") colorCountry(q.id); else markCapital(q.id);
  toast(BRAVO[Math.floor(Math.random()*BRAVO.length)] + " +" + pts, "good");
  qi++; setTimeout(nextQuestion, 900);
}
function giveUp(skipped){
  const q = questions[qi]; busy = true;
  const c = byId[q.id];
  if (q.type === "pays"){
    if (shapes[q.id]) shapes[q.id].classList.add("reveal");
    if (micros[q.id]) micros[q.id].classList.add("pulse");
    toast((skipped ? "" : "Pas grave ! ") + cap1(LABEL_LE[q.id]) + " est ici, en orange.", "hint");
  } else {
    const dot = gCap.querySelector(`.capdot[data-cap="${q.id}"]`) || el("circle", {cx:c.cx, cy:c.cy, r:5, class:"capdot"}, gCap);
    dot.classList.add("pulse");
    const t = el("text", {x:c.cx, y:c.cy, "data-x":c.cx, "dominant-baseline":"middle", class:"clabel"}, gFx);
    t.textContent = c.cap; t.style.display = "";
    applyVB(); t.style.display = "";
    toast((skipped ? "" : "Pas grave ! ") + c.cap + " est ici, en orange.", "hint");
  }
  qi++; setTimeout(nextQuestion, 2300);
}
function wrong(msg){
  tries++;
  if (tries >= 3) return giveUp(false);
  const q = questions[qi];
  if (tries === 2){
    msg += " Regarde ce qui clignote !";
    if (q.type === "pays"){ if (shapes[q.id]) shapes[q.id].classList.add("pulse"); if (micros[q.id]) micros[q.id].classList.add("pulse"); }
    else { const d = gCap.querySelector(`.capdot[data-cap="${q.id}"]`); if (d) d.classList.add("pulse"); }
  }
  toast(msg, "bad");
}
function flash(node){ node.classList.add("flash"); setTimeout(() => node.classList.remove("flash"), 500); }
function direction(dx, dy){ // dx,dy = de la réponse vers la bonne ville (y vers le bas)
  const a = Math.atan2(-dy, dx) * 180 / Math.PI;
  const dirs = ["à l'est","au nord-est","au nord","au nord-ouest","à l'ouest","au sud-ouest","au sud","au sud-est"];
  return dirs[Math.round(((a + 360) % 360) / 45) % 8];
}

function handleTap(x, y){
  if (busy || qi >= questions.length) return;
  const q = questions[qi];
  const node = document.elementFromPoint(x, y);
  if (q.type === "pays"){
    const id = node && node.dataset ? node.dataset.id : null;
    if (!id) return toast("Ça, c'est la mer ou un pays hors du jeu. Essaie encore !", "hint"); // pas compté comme une erreur
    if (id === q.id) return success();
    if (shapes[id]) flash(shapes[id]);
    return wrong("Ça, c'est " + LABEL_LE[id] + ".");
  }
  // capitale
  if (level !== "avance"){
    const id = node && node.dataset ? node.dataset.cap : null;
    if (!id) return toast("Touche un des ronds blancs : ce sont les capitales.", "hint");
    if (id === q.id) return success();
    const d = gCap.querySelector(`.capdot[data-cap="${id}"]`); if (d) flash(d);
    return wrong("Ça, c'est " + byId[id].cap + ", la capitale " + de(id) + ".");
  }
  // avancé : on mesure la distance
  const p = toMap(x, y), c = byId[q.id];
  const km = Math.round(Math.hypot(p.x - c.cx, p.y - c.cy) * c.k);
  if (km <= TOLERANCE_KM) return success();
  gFx.innerHTML = "";
  el("circle", {cx:p.x, cy:p.y, r:4, class:"pin"}, gFx); applyVB();
  const r = Math.round(km / 10) * 10;
  wrong("Tu es à environ " + r + " km. La ville est plus " + direction(c.cx - p.x, c.cy - p.y) + ".");
}

function finish(){
  document.getElementById("progress").style.width = "100%";
  const max = questions.length * 3;
  const pct = score / max;
  const n = pct >= .9 ? 3 : pct >= .6 ? 2 : 1;
  document.getElementById("stars").innerHTML = [0,1,2].map(i => `<span class="${i < n ? "" : "off"}">⭐</span>`).join("");
  document.getElementById("endTitle").textContent = n === 3 ? "Championne d'Europe !" : n === 2 ? "Très beau voyage !" : "Bon début, on recommence ?";
  document.getElementById("endScore").textContent = score + " points sur " + max;
  const key = "europe-best-" + level + "-" + mode, prev = getBest(key);
  let bestTxt = "";
  if (!prev || score > prev.score){ setBest(key, {score, max}); bestTxt = prev ? "Nouveau record ! 🎉" : ""; }
  else bestTxt = "Ton record : " + prev.score + " points";
  document.getElementById("endBest").textContent = bestTxt;
  setTimeout(() => show("end"), 700);
  showBest();
}

document.getElementById("start").onclick = startGame;
document.getElementById("again").onclick = startGame;
document.getElementById("toMenu").onclick = () => { show("menu"); showBest(); };
document.getElementById("back").onclick = () => { show("menu"); showBest(); };
document.getElementById("skip").onclick = () => { if (!busy && qi < questions.length){ tries = 3; giveUp(true); } };
applyVB();
</script>
